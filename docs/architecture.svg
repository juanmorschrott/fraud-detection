<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
  <title id="t">Hexagonal architecture</title>
  <desc id="d">The Spring Shell CLI calls the application core. The core reaches CSV and XML files and PostgreSQL through output ports.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
      .zone-title { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #64748b; }
      .name { font-size: 16px; font-weight: 600; fill: #0f172a; }
      .detail { font-size: 13px; fill: #475569; }
      .zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .in { fill: #dcfce7; stroke: #4ade80; stroke-width: 1.5; }
      .out { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.5; }
      .core { fill: #ede9fe; stroke: #8b5cf6; stroke-width: 2; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="900" height="420" rx="16" fill="#f8fafc"/>

  <text x="130" y="48" class="zone-title">INPUT</text>
  <text x="450" y="48" class="zone-title">CORE</text>
  <text x="770" y="48" class="zone-title">OUTPUT</text>

  <rect x="30" y="70" width="200" height="270" rx="14" class="zone"/>
  <rect x="55" y="175" width="150" height="70" rx="12" class="in"/>
  <text x="130" y="206" class="name">Spring Shell</text>
  <text x="130" y="228" class="detail">CLI adapter</text>

  <polygon points="300,210 375,80 525,80 600,210 525,340 375,340" class="core"/>
  <text x="450" y="160" class="detail">use case</text>
  <text x="450" y="185" class="name">DetectFraudUseCase</text>
  <text x="450" y="225" class="detail">domain</text>
  <text x="450" y="250" class="name">Reading · Result</text>

  <rect x="670" y="70" width="200" height="270" rx="14" class="zone"/>
  <rect x="695" y="105" width="150" height="70" rx="12" class="out"/>
  <text x="770" y="136" class="name">CSV / XML</text>
  <text x="770" y="158" class="detail">file adapter</text>
  <rect x="695" y="245" width="150" height="70" rx="12" class="out"/>
  <text x="770" y="276" class="name">PostgreSQL</text>
  <text x="770" y="298" class="detail">JPA adapter</text>

  <path d="M205 210 H296" class="arrow"/>
  <path d="M600 210 H635 V140 H691" class="arrow"/>
  <path d="M600 210 H635 V280 H691" class="arrow"/>

  <text x="450" y="390" class="detail">Dependencies point inward: adapters depend on the core, never the reverse.</text>
</svg>
