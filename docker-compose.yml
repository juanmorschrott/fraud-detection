services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: frauddetection
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d frauddetection"]
      interval: 5s
      timeout: 3s
      retries: 10

  fraud-detection:
    image: fraud-detection
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/frauddetection
      DB_USERNAME: fraud
      DB_PASSWORD: fraud
    stdin_open: true
    tty: true
