spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/frauddetection}
spring.datasource.username=${DB_USERNAME:fraud}
spring.datasource.password=${DB_PASSWORD:fraud}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/schema.sql
